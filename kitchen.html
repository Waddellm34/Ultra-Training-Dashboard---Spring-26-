<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen — Ultra 50</title>
<style>
@font-face {
  font-family: 'OpenDyslexic';
  src: url('https://cdn.jsdelivr.net/npm/opendyslexic@0.0.3/fonts/OpenDyslexic-Regular.woff2') format('woff2');
  font-weight: normal;
}
@font-face {
  font-family: 'OpenDyslexic';
  src: url('https://cdn.jsdelivr.net/npm/opendyslexic@0.0.3/fonts/OpenDyslexic-Bold.woff2') format('woff2');
  font-weight: bold;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'OpenDyslexic',Arial,sans-serif;background:#f9f8f6;color:#1a1a1a;font-size:16px;line-height:1.9}
.wrap{max-width:680px;margin:0 auto;padding:0 0 80px}
/* NAV */
.top-bar{background:#fff;border-bottom:1px solid #e5e5e3;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar-title{font-size:17px;font-weight:bold}
.back-link{font-size:13px;color:#2563eb;text-decoration:none;border-bottom:1px solid #bfdbfe}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e5e5e3;position:sticky;top:49px;z-index:99}
.tab{flex:1;padding:11px 4px;border:none;background:none;cursor:pointer;font-size:13px;font-family:'OpenDyslexic',Arial,sans-serif;color:#a3a3a3;font-weight:bold;border-bottom:3px solid transparent}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
/* PANELS */
.panel{display:none;padding:16px}
.panel.active{display:block}
/* RECIPE CARDS */
.recipe-grid{display:flex;flex-direction:column;gap:12px}
.recipe-card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color 0.15s}
.recipe-card:hover{border-color:#a3a3a3}
.recipe-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.recipe-name{font-size:16px;font-weight:bold;line-height:1.4}
.recipe-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:bold}
.tag-time{background:#fff7ed;color:#c2410c}
.tag-cuisine{background:#eff6ff;color:#1d4ed8}
.tag-veg{background:#f0fdf4;color:#15803d}
.tag-fish{background:#e0f2fe;color:#0369a1}
.tag-impressive{background:#faf5ff;color:#7e22ce}
.tag-breakfast{background:#fefce8;color:#a16207}
.tag-forage{background:#ecfdf5;color:#065f46}
.recipe-desc{font-size:13px;color:#737373;margin-top:6px;line-height:1.7}
/* FILTER ROW */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 12px;border:1px solid #e5e5e3;border-radius:999px;background:#fff;cursor:pointer;font-size:12px;font-family:'OpenDyslexic',Arial,sans-serif;color:#737373;font-weight:bold}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
/* COOK MODE */
.cook-header{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.cook-title{font-size:20px;font-weight:bold;margin-bottom:6px}
.cook-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:#737373}
.servings-ctrl{display:flex;align-items:center;gap:10px;margin-top:10px}
.sv-btn{width:32px;height:32px;border:1px solid #e5e5e3;border-radius:6px;background:#fff;cursor:pointer;font-size:18px;font-family:'OpenDyslexic',Arial,sans-serif;display:flex;align-items:center;justify-content:center;line-height:1}
.sv-num{font-size:16px;font-weight:bold;min-width:28px;text-align:center}
.step-block{background:#fff;border:2px solid #e5e5e3;border-radius:12px;padding:20px;margin-bottom:12px;transition:border-color 0.2s}
.step-block.active-step{border-color:#1a1a1a;background:#fafaf9}
.step-num{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.08em;color:#a3a3a3;margin-bottom:8px}
.step-text{font-size:17px;line-height:2;color:#1a1a1a}
.step-text .amt{color:#2563eb;font-weight:bold}
.step-text .action{font-weight:bold;color:#1a1a1a}
.step-timer{display:inline-flex;align-items:center;gap:6px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:4px 10px;font-size:13px;color:#c2410c;font-weight:bold;margin-top:8px;cursor:pointer}
.forage-note{display:flex;gap:8px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:8px 12px;font-size:13px;color:#065f46;margin-top:8px;line-height:1.6}
.step-tip{font-size:13px;color:#737373;background:#f9f8f6;border-radius:6px;padding:6px 10px;margin-top:6px;line-height:1.7}
.cook-nav{display:flex;gap:10px;margin-top:16px;align-items:center}
.cook-btn{flex:1;padding:14px;border:1px solid #e5e5e3;border-radius:10px;background:#fff;cursor:pointer;font-size:15px;font-family:'OpenDyslexic',Arial,sans-serif;font-weight:bold;color:#1a1a1a}
.cook-btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.cook-btn:disabled{opacity:0.3;cursor:default}
.speak-btn{padding:10px 14px;border:1px solid #e5e5e3;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-family:'OpenDyslexic',Arial,sans-serif}
.speak-btn.speaking{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.ingredients-list{background:#f9f8f6;border-radius:10px;padding:14px;margin-bottom:14px}
.ing-section-title{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.08em;color:#a3a3a3;margin-bottom:6px;margin-top:12px}
.ing-section-title:first-child{margin-top:0}
.ing-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #f0f0ef;font-size:14px}
.ing-row:last-child{border-bottom:none}
.ing-amt{font-weight:bold;color:#2563eb;min-width:80px;font-size:14px}
.ing-name{flex:1}
.ing-garden{font-size:10px;background:#f0fdf4;color:#15803d;padding:1px 6px;border-radius:999px;font-weight:bold}
/* PANTRY */
.pantry-section{margin-bottom:20px}
.pantry-section-title{font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:0.06em;color:#a3a3a3;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #f0f0ef}
.pantry-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pantry-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e5e5e3;border-radius:8px;cursor:pointer;background:#fff;font-size:13px;font-family:'OpenDyslexic',Arial,sans-serif}
.pantry-item.have{background:#f0fdf4;border-color:#86efac;color:#15803d}
.pantry-check{width:18px;height:18px;border:1.5px solid #d4d4d2;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.pantry-item.have .pantry-check{background:#16a34a;border-color:#16a34a;color:#fff}
.available-card{background:#fff;border:1px solid #e5e5e3;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.available-card:hover{border-color:#a3a3a3}
.available-name{font-size:15px;font-weight:bold}
.available-missing{font-size:12px;color:#ea580c;margin-top:3px}
.available-have{font-size:12px;color:#16a34a;margin-top:3px}
.section-header{font-size:14px;font-weight:bold;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.section-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* SHOPPING */
.shop-section{margin-bottom:18px}
.shop-section-title{font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:0.06em;color:#a3a3a3;margin-bottom:8px;padding:6px 0;border-bottom:1px solid #f0f0ef;display:flex;align-items:center;gap:6px}
.shop-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f9f8f6;cursor:pointer}
.shop-check{width:22px;height:22px;border:1.5px solid #d4d4d2;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff}
.shop-item.checked .shop-check{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.shop-item.checked .shop-item-name{text-decoration:line-through;color:#a3a3a3}
.shop-item-name{flex:1;font-size:15px;line-height:1.5}
.shop-item-source{font-size:11px;color:#a3a3a3}
.shop-add-row{display:flex;gap:8px;margin-bottom:16px}
.shop-input{flex:1;padding:10px 12px;border:1px solid #e5e5e3;border-radius:8px;font-size:14px;font-family:'OpenDyslexic',Arial,sans-serif;background:#fff}
.shop-add-btn{padding:10px 16px;border:1px solid #1a1a1a;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:13px;font-family:'OpenDyslexic',Arial,sans-serif;font-weight:bold;white-space:nowrap}
.shop-clear-btn{padding:6px 12px;border:1px solid #e5e5e3;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-family:'OpenDyslexic',Arial,sans-serif;color:#737373}
.garden-note{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;font-size:13px;color:#15803d;margin-bottom:12px;line-height:1.6}
/* SPICE KIT */
.spice-kit{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;margin-bottom:16px}
.spice-kit-title{font-size:13px;font-weight:bold;color:#c2410c;margin-bottom:8px}
/* TIMER */
.timer-overlay{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:999px;font-size:20px;font-weight:bold;font-family:'OpenDyslexic',Arial,sans-serif;z-index:200;display:none;align-items:center;gap:12px}
.timer-cancel{background:none;border:1px solid #fff;border-radius:999px;color:#fff;padding:4px 12px;cursor:pointer;font-size:13px;font-family:'OpenDyslexic',Arial,sans-serif}
/* MISC */
.empty-state{text-align:center;padding:3rem 1rem;color:#a3a3a3;font-size:14px;line-height:2}
.badge-impressive{display:inline-block;background:#faf5ff;color:#7e22ce;border:1px solid #e9d5ff;border-radius:6px;font-size:11px;padding:2px 8px;font-weight:bold;margin-left:6px}
.unit-toggle{font-size:11px;background:#f5f5f3;border:1px solid #e5e5e3;border-radius:4px;padding:2px 6px;cursor:pointer;margin-left:4px;font-family:'OpenDyslexic',Arial,sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="index.html" class="back-link">← Dashboard</a>
    <div class="top-bar-title">Kitchen</div>
    <div style="width:80px"></div>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('recipes')">Recipes</button>
    <button class="tab" onclick="showTab('cook')">Cook</button>
    <button class="tab" onclick="showTab('pantry')">Pantry</button>
    <button class="tab" onclick="showTab('shop')">Shop</button>
  </div>
  <div id="panel-recipes" class="panel active"></div>
  <div id="panel-cook" class="panel"></div>
  <div id="panel-pantry" class="panel"></div>
  <div id="panel-shop" class="panel"></div>
</div>
<div class="timer-overlay" id="timer-overlay">
  <span id="timer-display">0:00</span>
  <button class="timer-cancel" onclick="cancelTimer()">cancel</button>
</div>
<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const RECIPES = [
  {
    id:'r01', name:'Mushroom & Cheese Omelette', category:'breakfast', cuisine:'American',
    time:12, impressive:false, forageable:true,
    desc:'Silky folded omelette with sautéed mushrooms and melted cheese. The benchmark breakfast.',
    tags:['vegetarian','mushroom','quick'],
    ingredients:[
      {name:'eggs',amt:3,unit:'large',section:'dairy',pantry:false},
      {name:'mushrooms, sliced',amt:1,unit:'cup',section:'produce',pantry:false,forage:'Wild chanterelles or hen-of-the-woods would be extraordinary here'},
      {name:'cheddar or gruyère, grated',amt:'¼',unit:'cup',section:'dairy',pantry:false},
      {name:'butter',amt:1,unit:'tbsp',section:'dairy',pantry:true},
      {name:'fresh thyme (optional)',amt:'2',unit:'sprigs',section:'produce',pantry:false},
      {name:'salt and black pepper',amt:'',unit:'to taste',section:'pantry',pantry:true},
    ],
    steps:[
      {text:'Crack <amt>3 large eggs</amt> into a bowl. Add a pinch of salt. <action>Beat</action> with a fork until the yolk and white are fully combined — about 30 seconds.',timer:0,tip:'Don't over-beat. You want it uniform, not foamy.'},
      {text:'<action>Heat</action> a non-stick pan over medium-high. Add <amt>1 tbsp butter</amt> and let it melt and foam.',timer:0,tip:'When the foam starts to subside, the pan is ready.'},
      {text:'<action>Add</action> <amt>1 cup sliced mushrooms</amt> to the pan. <action>Cook</action> without stirring for 2 minutes until they brown on one side.',timer:120,tip:'Resist the urge to stir — let them get golden.',forage:'Fresh foraged chanterelles or hen-of-the-woods: add 30 extra seconds here.'},
      {text:'<action>Stir</action> the mushrooms, then push them to the side of the pan.',timer:0},
      {text:'<action>Pour</action> the beaten eggs into the empty side of the pan. Let them sit for 15 seconds without touching.',timer:15},
      {text:'With a spatula, <action>push</action> the cooked egg edges toward the center, tilting the pan so raw egg flows to the edges. Repeat until the top is just barely wet.',timer:0,tip:'This is the technique. Slow and steady.'},
      {text:'<action>Scatter</action> <amt>¼ cup grated cheese</amt> and the mushrooms across one half of the omelette.',timer:0},
      {text:'<action>Fold</action> the empty half over the filling. <action>Slide</action> onto a plate immediately.',timer:0,tip:'The residual heat finishes melting the cheese perfectly.'},
    ]
  },
  {
    id:'r02', name:'Blackened Baja Fish Tacos', category:'impressive', cuisine:'Mexican',
    time:25, impressive:true, forageable:false,
    desc:'Crispy blackened white fish, crunchy slaw, lime crema, fresh pico. Looks like a restaurant. Done in 25 minutes.',
    tags:['pescatarian','fish','impressive','30-min'],
    ingredients:[
      {name:'white fish fillets (cod, mahi, tilapia)',amt:2,unit:'6oz pieces',section:'protein',pantry:false},
      {name:'smoked paprika',amt:1,unit:'tsp',section:'pantry',pantry:true},
      {name:'cumin',amt:1,unit:'tsp',section:'pantry',pantry:true},
      {name:'garlic powder',amt:'½',unit:'tsp',section:'pantry',pantry:true},
      {name:'cayenne',amt:'¼',unit:'tsp',section:'pantry',pantry:true},
      {name:'dried oregano',amt:'½',unit:'tsp',section:'pantry',pantry:true},
      {name:'salt',amt:1,unit:'tsp',section:'pantry',pantry:true},
      {name:'olive oil',amt:2,unit:'tbsp',section:'pantry',pantry:true},
      {name:'corn tortillas',amt:6,unit:'small',section:'pantry',pantry:false},
      {name:'cabbage, thinly shredded',amt:2,unit:'cups',section:'produce',pantry:false},
      {name:'lime',amt:2,unit:'whole',section:'produce',pantry:false},
      {name:'sour cream or Greek yogurt',amt:'¼',unit:'cup',section:'dairy',pantry:false},
      {name:'fresh cilantro',amt:'handful',unit:'',section:'produce',pantry:false},
      {name:'tomato, diced (or from garden)',amt:1,unit:'medium',section:'garden',pantry:false},
      {name:'jalapeño, minced',amt:'½',unit:'whole',section:'produce',pantry:false},
      {name:'red onion, minced',amt:2,unit:'tbsp',section:'produce',pantry:false},
    ],
    steps:[
      {text:'<action>Mix</action> together in a small bowl: <amt>1 tsp smoked paprika</amt>, <amt>1 tsp cumin</amt>, <amt>½ tsp garlic powder</amt>, <amt>¼ tsp cayenne</amt>, <amt>½ tsp oregano</amt>, <amt>1 tsp salt</amt>. This is your blackening spice.',timer:0,tip:'Make a double batch and keep the rest. You'll use it again.'},
      {text:'<action>Make the pico</action>: Combine diced <amt>1 tomato</amt>, <amt>2 tbsp red onion</amt>, <amt>½ jalapeño</amt>, a handful of cilantro, and the juice of <amt>½ lime</amt> in a small bowl. Set aside.',timer:0},
      {text:'<action>Make the crema</action>: Stir together <amt>¼ cup sour cream</amt> with the juice of <amt>½ lime</amt> and a pinch of salt. Set aside.',timer:0},
      {text:'<action>Toss</action> <amt>2 cups shredded cabbage</amt> with the juice of <amt>½ lime</amt> and a pinch of salt. Set aside.',timer:0},
      {text:'<action>Pat</action> the <amt>2 fish fillets</amt> completely dry with paper towels. This is important for blackening.',timer:0,tip:'Wet fish steams instead of blackening. Dry it thoroughly.'},
      {text:'<action>Press</action> the blackening spice firmly onto both sides of each fillet.',timer:0},
      {text:'<action>Heat</action> a cast iron or heavy pan over high heat for 2 minutes. Add <amt>2 tbsp olive oil</amt>.',timer:120},
      {text:'<action>Place</action> the fillets in the pan. Do not move them. <action>Cook</action> for 3 minutes until a dark crust forms.',timer:180,tip:'It will smoke. That's correct. Open a window.'},
      {text:'<action>Flip</action> once. <action>Cook</action> for another 2 minutes. Remove from heat.',timer:120},
      {text:'<action>Warm</action> the corn tortillas directly over a gas flame for 20 seconds per side, or in a dry pan.',timer:0},
      {text:'<action>Break</action> the fish into chunks. <action>Build</action> each taco: tortilla → slaw → fish → pico → crema → squeeze of lime.',timer:0,tip:'Serve immediately. These do not wait.'},
    ]
  },
  {
    id:'r03', name:'Shakshuka', category:'weeknight', cuisine:'Mediterranean',
    time:25, impressive:true, forageable:true,
    desc:'Eggs poached in spiced tomato and pepper sauce. One pan, deeply satisfying, works for breakfast or dinner.',
    tags:['vegetarian','mushroom','impressive','one-pan'],
    ingredients:[
      {name:'eggs',amt:4,unit:'large',section:'dairy',pantry:false},
      {name:'canned crushed tomatoes',amt:1,unit:'14oz can',section:'pantry',pantry:true},
      {name:'red bell pepper, diced',amt:1,unit:'medium',section:'produce',pantry:false},
      {name:'yellow onion, diced',amt:'½',unit:'medium',section:'produce',pantry:false},
      {name:'garlic cloves, minced',amt:3,unit:'cloves',section:'produce',pantry:true},
      {name:'mushrooms, sliced (optional)',amt:1,unit:'cup',section:'produce',pantry:false,forage:'Any wild mushroom is fantastic here. Add with the peppers.'},
      {name:'cumin',amt:1,unit:'tsp',section:'pantry',pantry:true},
      {name:'smoked paprika',amt:1,unit:'tsp',section:'pantry',pantry:true},
      {name:'chili flakes',amt:'¼',unit:'tsp',section:'pantry',pantry:true},
      {name:'olive oil',amt:2,unit:'tbsp',section:'pantry',pantry:true},
      {name:'salt',amt:'',unit:'to taste',section:'pantry',pantry:true},
      {name:'fresh parsley or cilantro',amt:'handful',unit:'',section:'produce',pantry:false},
      {name:'feta cheese (optional)',amt:'¼',unit:'cup',section:'dairy',pantry:false},
      {name:'sourdough or pita for dipping',amt:2,unit:'pieces',section:'pantry',pantry:false},
    ],
    steps:[
      {text:'<action>Heat</action> <amt>2 tbsp olive oil</amt> in a large oven-safe pan over medium heat.',timer:0},
      {text:'<action>Add</action> <amt>½ diced onion</amt> and <amt>1 diced bell pepper</amt>. <action>Cook</action>, stirring occasionally, for 5 minutes until softened.',timer:300,forage:'Add <amt>1 cup sliced mushrooms</amt> here if using. Cook together.'},
      {text:'<action>Add</action> <amt>3 minced garlic cloves</amt>, <amt>1 tsp cumin</amt>, <amt>1 tsp smoked paprika</amt>, <amt>¼ tsp chili flakes</amt>. <action>Stir</action> for 30 seconds.',timer:30,tip:'You'll smell when the spices are bloomed — fragrant and slightly deeper.'},
      {text:'<action>Pour in</action> the <amt>14oz can of crushed tomatoes</amt>. Add a pinch of salt. <action>Stir</action> to combine.',timer:0},
      {text:'<action>Simmer</action> over medium-low for 8 minutes, stirring occasionally, until the sauce thickens slightly.',timer:480},
      {text:'Use a spoon to <action>make 4 wells</action> in the sauce. <action>Crack</action> one egg into each well.',timer:0,tip:'Crack eggs into a cup first if you're nervous about shells.'},
      {text:'<action>Cover</action> the pan. <action>Cook</action> for 5–7 minutes — 5 for runny yolks, 7 for set yolks.',timer:300,tip:'Check at 5 minutes by gently pressing the white near the yolk. Firm white = ready.'},
      {text:'<action>Remove</action> from heat. <action>Scatter</action> crumbled feta and fresh herbs over the top.',timer:0},
      {text:'<action>Serve</action> directly from the pan with bread for dipping. Do not transfer to plates.',timer:0,tip:'Eating from the pan is the correct move here.'},
    ]
  },
  {
    id:'r04', name:'Shrimp Aglio e Olio', category:'impressive', cuisine:'Italian',
    time:20, impressive:true, forageable:false,
    desc:'Pasta, garlic, olive oil, shrimp, chili. Five ingredients, twenty minutes, genuinely impressive.',
    tags:['pescatarian','shrimp','impressive','quick'],
    ingredients:[
      {name:'spaghetti or linguine',amt:200,unit:'g',section:'pantry',pantry:true},
      {name:'large shrimp, peeled and deveined',amt:300,unit:'g',section:'protein',pantry:false},
      {name:'garlic cloves, thinly sliced',amt:6,unit:'cloves',section:'produce',pantry:true},
      {name:'olive oil, good quality',amt:'⅓',unit:'cup',section:'pantry',pantry:true},
      {name:'chili flakes',amt:'½',unit:'tsp',section:'pantry',pantry:true},
      {name:'fresh parsley, chopped',amt:'large handful',unit:'',section:'produce',pantry:false},
      {name:'lemon',amt:1,unit:'whole',section:'produce',pantry:false},
      {name:'parmesan (optional for fish — breaks tradition but tastes good)',amt:'',unit:'',section:'dairy',pantry:false},
      {name:'salt',amt:'',unit:'for pasta water',section:'pantry',pantry:true},
    ],
    steps:[
      {text:'<action>Bring</action> a large pot of water to a boil. Salt it heavily — it should taste like the sea. <action>Cook</action> <amt>200g pasta</amt> until 2 minutes shy of al dente. Reserve <amt>1 cup pasta water</amt> before draining.',timer:0,tip:'The pasta will finish cooking in the sauce. Undercook it here.'},

function showTab(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>{ if(t.textContent.toLowerCase()===name) t.classList.add('active'); });
  if(name==='recipes') renderRecipes();
  if(name==='cook') renderCook();
  if(name==='pantry') renderPantry();
  if(name==='shop') renderShop();
}

// ─── UNIT CONVERSION ─────────────────────────────────────────────────────────
function convertAmt(amt, unit){
  if(!metricMode) return {amt, unit};
  const convMap = {
    'tbsp': {factor:14.79, toUnit:'ml'}, 'tsp': {factor:4.93, toUnit:'ml'},
    'cup': {factor:236.6, toUnit:'ml'}, 'oz': {factor:28.35, toUnit:'g'},
    'lb': {factor:453.6, toUnit:'g'}, 'fl_oz': {factor:29.57, toUnit:'ml'},
  };
  const c = convMap[unit];
  if(c && !isNaN(parseFloat(amt))){
    return {amt: Math.round(parseFloat(amt)*c.factor), unit: c.toUnit};
  }
  return {amt, unit};
}

function fmtAmt(amt, unit){
  const c = convertAmt(amt, unit);
  return c.unit ? `${c.amt} ${c.unit}` : `${c.amt}`;
}

// ─── RECIPES TAB ─────────────────────────────────────────────────────────────
function renderRecipes(){
  const cats = [
    {key:'all',label:'All'},
    {key:'breakfast',label:'Breakfast'},
    {key:'weeknight',label:'Weeknight'},
    {key:'impressive',label:'Impressive'},
    {key:'weekend',label:'Weekend'},
    {key:'mushroom',label:'🍄 Mushroom'},
    {key:'quick',label:'Under 20 min'},
  ];
  let html = '<div class="filter-row">';
  cats.forEach(c=>{
    html += `<button class="filter-btn${filterCat===c.key?' active':''}" onclick="setFilter('${c.key}')">${c.label}</button>`;
  });
  html += '</div><div class="recipe-grid">';
  const filtered = RECIPES.filter(r=>{
    if(filterCat==='all') return true;
    if(filterCat==='mushroom') return r.forageable || r.tags.includes('mushroom');
    if(filterCat==='quick') return r.time<=20;
    if(filterCat==='breakfast') return r.category==='breakfast';
    if(filterCat==='impressive') return r.impressive;
    if(filterCat==='weeknight') return r.category==='weeknight';
    if(filterCat==='weekend') return r.category==='weekend';
    return true;
  });
  filtered.forEach(r=>{
    const availInfo = getAvailability(r);
    html += `<div class="recipe-card" onclick="startCook('${r.id}')">
      <div class="recipe-card-top">
        <div>
          <div class="recipe-name">${r.name}${r.impressive?'<span class="badge-impressive">✦ Impressive</span>':''}</div>
          <div class="recipe-meta">
            <span class="tag tag-time">⏱ ${r.time} min</span>
            <span class="tag tag-cuisine">${r.cuisine}</span>
            ${r.forageable?'<span class="tag tag-forage">🌿 Forageable</span>':''}
            ${r.tags.includes('vegetarian')?'<span class="tag tag-veg">🌱 Veggie</span>':''}
            ${r.tags.includes('pescatarian')&&!r.tags.includes('vegetarian')?'<span class="tag tag-fish">🐟 Fish</span>':''}
          </div>
        </div>
      </div>
      <div class="recipe-desc">${r.desc}</div>
      <div style="margin-top:8px;font-size:12px;color:${availInfo.color};font-weight:bold">${availInfo.label}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('panel-recipes').innerHTML = html;
}

function setFilter(cat){ filterCat=cat; renderRecipes(); }

function getAvailability(recipe){
  const ings = recipe.ingredients.filter(i=>!i.pantry);
  const have = ings.filter(i=>pantryState[i.name]);
  const missing = ings.length - have.length;
  if(missing===0) return {color:'#16a34a',label:'✓ You can make this now'};
  if(missing<=2) return {color:'#ea580c',label:`Almost there — ${missing} item${missing>1?'s':''} needed`};
  return {color:'#a3a3a3',label:`${missing} items needed`};
}

// ─── COOK TAB ────────────────────────────────────────────────────────────────
function startCook(id){
  activeRecipe = RECIPES.find(r=>r.id===id);
  activeStep = 0;
  servings = 1;
  showTab('cook');
}

function renderCook(){
  if(!activeRecipe){
    document.getElementById('panel-cook').innerHTML = `
      <div class="empty-state">
        Tap a recipe in the <strong>Recipes</strong> tab<br>to start cooking.
      </div>`;
    return;
  }
  const r = activeRecipe;
  const step = r.steps[activeStep];
  const totalSteps = r.steps.length;
  // Build ingredients grouped by section
  const sections = {};
  r.ingredients.forEach(i=>{
    const sec = i.section==='garden'?'Garden (check first)':i.section==='protein'?'Protein & Fish':i.section==='dairy'?'Dairy & Eggs':i.section==='produce'?'Produce':i.section==='pantry'?'Pantry Staples':'Other';
    if(!sections[sec]) sections[sec]=[];
    sections[sec].push(i);
  });
  let ingHtml = '<div class="ingredients-list"><strong style="font-size:13px">Ingredients</strong>';
  Object.entries(sections).forEach(([sec,items])=>{
    ingHtml += `<div class="ing-section-title">${sec}</div>`;
    items.forEach(i=>{
      const a = i.amt ? fmtAmt(i.amt*servings, i.unit) : '';
      ingHtml += `<div class="ing-row"><span class="ing-amt">${a}</span><span class="ing-name">${i.name}${i.section==='garden'?'<span class="ing-garden">garden</span>':''}</span>${i.forage?'<span class="tag tag-forage" style="font-size:10px">🌿</span>':''}</div>`;
    });
  });
  ingHtml += `<button class="unit-toggle" onclick="toggleMetric()" style="margin-top:10px">${metricMode?'Switch to US':'Switch to metric'}</button></div>`;
  // Format step text
  let stepText = step.text.replace(/<amt>(.*?)<\/amt>/g,'<span class="amt">$1</span>').replace(/<action>(.*?)<\/action>/g,'<span class="action">$1</span>');
  let html = `
    <div class="cook-header">
      <div class="cook-title">${r.name}</div>
      <div class="cook-meta">
        <span>⏱ ${r.time} min total</span>
        <span>${r.cuisine}</span>
        ${r.impressive?'<span style="color:#7e22ce">✦ Impressive</span>':''}
      </div>
      <div class="servings-ctrl">
        <span style="font-size:13px;color:#737373">Servings:</span>
        <button class="sv-btn" onclick="changeServings(-1)">−</button>
        <span class="sv-num">${servings}</span>
        <button class="sv-btn" onclick="changeServings(1)">+</button>
      </div>
    </div>
    ${ingHtml}
    <div style="font-size:12px;font-weight:bold;color:#a3a3a3;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em">Step ${activeStep+1} of ${totalSteps}</div>
    <div style="height:4px;background:#f0f0ef;border-radius:999px;margin-bottom:14px;overflow:hidden">
      <div style="width:${Math.round((activeStep/Math.max(totalSteps-1,1))*100)}%;height:100%;background:#1a1a1a;border-radius:999px;transition:width 0.3s"></div>
    </div>`;
  // All steps, highlight active
  r.steps.forEach((s,i)=>{
    const isActive = i===activeStep;
    let st = s.text.replace(/<amt>(.*?)<\/amt>/g,'<span class="amt">$1</span>').replace(/<action>(.*?)<\/action>/g,'<span class="action">$1</span>');
    html += `<div class="step-block${isActive?' active-step':''}" id="step-${i}">
      <div class="step-num">Step ${i+1}</div>
      <div class="step-text">${st}</div>
      ${s.timer>0?`<div class="step-timer" onclick="startTimer(${s.timer})">⏱ Set ${Math.floor(s.timer/60)}:${String(s.timer%60).padStart(2,'0')} timer</div>`:''}
      ${s.forage?`<div class="forage-note"><span>🌿</span><span>${s.forage}</span></div>`:''}
      ${s.tip?`<div class="step-tip">💡 ${s.tip}</div>`:''}
    </div>`;
  });
  html += `<div class="cook-nav">
    <button class="cook-btn" onclick="prevStep()" ${activeStep===0?'disabled':''}>← Back</button>
    <button class="speak-btn${speaking?' speaking':''}" id="speak-btn" onclick="toggleSpeak()">🔊 Read</button>
    <button class="cook-btn primary" onclick="nextStep()" ${activeStep===totalSteps-1?'disabled':''}>Next →</button>
  </div>`;
  document.getElementById('panel-cook').innerHTML = html;
  document.getElementById(`step-${activeStep}`)?.scrollIntoView({behavior:'smooth',block:'center'});
}

function changeServings(d){ servings=Math.max(1,Math.min(8,servings+d)); renderCook(); }
function toggleMetric(){ metricMode=!metricMode; renderCook(); }

function prevStep(){
  if(activeStep>0){ stopSpeak(); activeStep--; renderCook(); }
}
function nextStep(){
  if(activeStep<activeRecipe.steps.length-1){ stopSpeak(); activeStep++; renderCook(); }
}

// ─── READ ALOUD ───────────────────────────────────────────────────────────────
function getStepText(step){
  return step.text.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
}

function toggleSpeak(){
  if(speaking){ stopSpeak(); return; }
  speaking=true;
  const step = activeRecipe.steps[activeStep];
  let text = getStepText(step);
  if(step.tip) text += '. Tip: ' + step.tip;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.88;
  utter.pitch = 1;
  utter.onend = ()=>{ speaking=false; const btn=document.getElementById('speak-btn'); if(btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(utter);
  const btn=document.getElementById('speak-btn');
  if(btn) btn.classList.add('speaking');
}
function stopSpeak(){
  speaking=false;
  speechSynthesis.cancel();
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function startTimer(seconds){
  if(timerInterval) clearInterval(timerInterval);
  timerRemaining=seconds;
  const overlay=document.getElementById('timer-overlay');
  overlay.style.display='flex';
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timerRemaining--;
    updateTimerDisplay();
    if(timerRemaining<=0){
      clearInterval(timerInterval);
      overlay.style.display='none';
      const utter=new SpeechSynthesisUtterance('Timer done.');
      speechSynthesis.speak(utter);
    }
  },1000);
}
function updateTimerDisplay(){
  const m=Math.floor(timerRemaining/60);
  const s=String(timerRemaining%60).padStart(2,'0');
  document.getElementById('timer-display').textContent=`${m}:${s}`;
}
function cancelTimer(){
  clearInterval(timerInterval);
  document.getElementById('timer-overlay').style.display='none';
}

// ─── PANTRY TAB ───────────────────────────────────────────────────────────────
function renderPantry(){
  // Available recipes
  const canMake=[], almostThere=[];
  RECIPES.forEach(r=>{
    const nonPantry=r.ingredients.filter(i=>!i.pantry);
    const missing=nonPantry.filter(i=>!pantryState[i.name]);
    if(missing.length===0) canMake.push({r,missing:[]});
    else if(missing.length<=2) almostThere.push({r,missing});
  });
  let html='';
  // Can make now
  html+=`<div class="section-header"><div class="section-dot" style="background:#16a34a"></div>Make right now (${canMake.length})</div>`;
  if(canMake.length===0){
    html+='<div style="font-size:13px;color:#a3a3a3;margin-bottom:16px;line-height:1.8">Stock up on some ingredients and recipes will appear here.</div>';
  } else {
    canMake.forEach(({r})=>{
      html+=`<div class="available-card" onclick="startCook('${r.id}')">
        <div class="available-name">${r.name}</div>
        <div class="available-have" style="color:#16a34a">✓ You have everything · ${r.time} min</div>
      </div>`;
    });
  }
  // Almost there
  html+=`<div class="section-header" style="margin-top:16px"><div class="section-dot" style="background:#ea580c"></div>Almost there — grab 1–2 items (${almostThere.length})</div>`;
  almostThere.forEach(({r,missing})=>{
    html+=`<div class="available-card" onclick="startCook('${r.id}')">
      <div class="available-name">${r.name}</div>
      <div class="available-missing">Need: ${missing.map(i=>i.name).join(', ')}</div>
      <div style="font-size:11px;color:#a3a3a3;margin-top:2px">${r.time} min · <span style="cursor:pointer;color:#2563eb;text-decoration:underline" onclick="event.stopPropagation();addMissingToShop('${r.id}')">Add missing to shopping list</span></div>
    </div>`;
  });
  // Pantry tracker
  html+=`<div style="margin-top:20px;padding-top:16px;border-top:1px solid #f0f0ef">
    <div class="section-header" style="margin-top:0">What you have on hand</div>
    <div style="font-size:12px;color:#a3a3a3;margin-bottom:12px">Tap items to mark as in stock. This updates your available recipes.</div>`;
  Object.entries(PANTRY_SECTIONS).forEach(([sec,items])=>{
    html+=`<div class="pantry-section"><div class="pantry-section-title">${sec}</div><div class="pantry-grid">`;
    items.forEach(item=>{
      const have=pantryState[item];
      html+=`<div class="pantry-item${have?' have':''}" onclick="togglePantry('${item}')">
        <div class="pantry-check">${have?'✓':''}</div>
        <span>${item}</span>
      </div>`;
    });
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('panel-pantry').innerHTML=html;
}

function togglePantry(item){
  pantryState[item]=!pantryState[item];
  saveState();
  renderPantry();
}

function addMissingToShop(recipeId){
  const r=RECIPES.find(x=>x.id===recipeId);
  if(!r) return;
  const missing=r.ingredients.filter(i=>!i.pantry&&!pantryState[i.name]);
  missing.forEach(i=>{
    if(!shoppingList.find(s=>s.name===i.name)){
      shoppingList.push({
        name:i.name,
        section:i.section==='garden'?'Produce & Garden':i.section==='protein'?'Protein & Fish':i.section==='dairy'?'Dairy & Eggs':'Pantry & Dry Goods',
        checked:false,
        custom:false
      });
    }
  });
  saveState();
  renderPantry();
}

        <div>
          <div class="shop-item-name">${item.name}</div>
        </div>
        <button onclick="event.stopPropagation();removeShopItem(${realIdx})" style="background:none;border:none;color:#d4d4d2;cursor:pointer;font-size:16px;padding:0 4px">×</button>
      </div>`;
    });
    html+='</div>';
  });
  // Clear checked button
  const checkedCount=shoppingList.filter(i=>i.checked).length;
  if(checkedCount>0){
    html+=`<div style="text-align:center;padding:10px 0">
      <button class="shop-clear-btn" onclick="clearChecked()">Clear ${checkedCount} checked item${checkedCount>1?'s':''}</button>
    </div>`;
  }
  document.getElementById('panel-shop').innerHTML=html;
}

function addShopItem(){
  const input=document.getElementById('shop-new-item');
  const section=document.getElementById('shop-new-section')?.value||'Pantry & Dry Goods';
  const name=input?.value?.trim();
  if(!name) return;
  shoppingList.push({name,section,checked:false,custom:true});
  if(input) input.value='';
  saveState();
  renderShop();
}

function toggleShopItem(idx){
  shoppingList[idx].checked=!shoppingList[idx].checked;
  saveState();
  renderShop();
}

function removeShopItem(idx){
  shoppingList.splice(idx,1);
  saveState();
  renderShop();
}

function clearChecked(){
  shoppingList=shoppingList.filter(i=>!i.checked);
  saveState();
  renderShop();
}

function toggleSpiceKit(spice){
  const existing=shoppingList.find(i=>i.name===spice&&i.section==='Spice Restock');
  if(existing){ shoppingList=shoppingList.filter(i=>!(i.name===spice&&i.section==='Spice Restock')); }
  else { shoppingList.push({name:spice,section:'Spice Restock',checked:false,custom:false}); }
  saveState();
  renderShop();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderRecipes();
</script>
</body>
</html>
