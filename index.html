<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra 50 Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f4;color:#1a1a1a;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;overflow:hidden;margin-bottom:16px}
.header{padding:14px 16px;border-bottom:1px solid #f0f0ef}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phase-badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.progress-bar{height:4px;background:#e5e5e3;border-radius:999px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;background:#fff;border-radius:999px;transition:width 0.3s}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:#737373}
.nav{padding:8px 16px;background:#fafaf9;border-bottom:1px solid #f0f0ef;display:flex;align-items:center;gap:8px}
.nav-btn{padding:5px 12px;border:1px solid #e5e5e3;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:#1a1a1a}
.nav-btn:disabled{color:#d4d4d2;cursor:default}
.nav-center{flex:1;text-align:center;font-size:11px;color:#737373}
.today-btn{padding:5px 12px;border:1px solid #1a1a1a;border-radius:6px;background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:#1a1a1a}
.day-hero{padding:14px 16px;border-bottom:1px solid #f0f0ef}
.day-meta{font-size:11px;color:#737373;margin-bottom:4px}
.day-title{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.4}
.day-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.badge-secondary{background:#f5f5f3;color:#525252}
.mark-btn{padding:6px 12px;border:1px solid #e5e5e3;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;color:#737373}
.mark-btn.done{border-color:#16a34a;background:#dcfce7;color:#16a34a}
.section-toggle{width:100%;text-align:left;padding:12px 16px;background:none;border:none;border-bottom:1px solid #f0f0ef;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.section-body{padding:0 16px 14px}
.ex-header{display:grid;grid-template-columns:1fr 50px 60px;gap:6px;font-size:10px;font-weight:600;color:#a3a3a3;text-transform:uppercase;letter-spacing:0.04em;padding:4px 0;border-bottom:1px solid #f0f0ef;margin-bottom:2px}
.ex-row{display:grid;grid-template-columns:1fr 50px 60px;gap:6px;padding:5px 0;border-bottom:1px solid #f5f5f3;font-size:13px}
.ex-row:last-child{border-bottom:none}
.ex-sets{color:#737373}
.lift-note{margin-top:10px;padding:8px 10px;background:#fafaf9;border-radius:6px;font-size:12px;color:#737373;line-height:1.6}
.run-block{padding:12px 16px;background:#fafaf9;border-radius:8px;margin-bottom:4px}
.run-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.run-title{font-size:14px;font-weight:600}
.run-miles{font-size:14px;font-weight:600;margin-left:auto}
.run-desc{font-size:13px;color:#525252;line-height:1.7}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.macro-card{border-radius:8px;padding:8px 4px;text-align:center}
.macro-val{font-size:15px;font-weight:700}
.macro-lbl{font-size:10px;color:#737373;margin-top:1px}
.meal-card{border:1px solid #f0f0ef;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.meal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.meal-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
.meal-cal{font-size:11px;color:#737373}
.meal-items{font-size:13px;color:#525252;line-height:1.6}
.week-strip{padding:12px 16px;border-bottom:1px solid #f0f0ef}
.week-label{font-size:10px;font-weight:700;color:#a3a3a3;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-day{padding:6px 2px;border-radius:6px;cursor:pointer;border:1px solid #e5e5e3;background:#fff;text-align:center}
.week-day.active{border-width:1.5px}
.week-day-name{font-size:10px;color:#a3a3a3;margin-bottom:3px}
.week-dot{width:6px;height:6px;border-radius:50%;margin:0 auto 3px}
.week-info{font-size:9px;color:#737373}
.week-jumper{padding:10px 16px;border-top:1px solid #f0f0ef}
.week-nums{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.wk-num{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid #e5e5e3;background:#fafaf9;color:#737373}
.wk-num.active{background:#fff;color:#fff;border-color:#1a1a1a;font-weight:600}
.footer{padding:10px 16px;background:#fafaf9;display:flex;gap:8px;justify-content:flex-end}
.footer-btn{font-size:11px;padding:5px 10px;border:1px solid #e5e5e3;border-radius:6px;background:#fff;cursor:pointer;color:#737373}
.rest-msg{padding:14px 16px;border-bottom:1px solid #f0f0ef;font-size:13px;color:#737373;line-height:1.7}
.import-screen{padding:3rem 1rem;text-align:center}
.import-icon{width:56px;height:56px;border:1px solid #e5e5e3;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;background:#fafaf9;font-size:24px}
.import-title{font-size:20px;font-weight:700;margin-bottom:8px}
.import-desc{font-size:14px;color:#737373;max-width:300px;margin:0 auto 1.5rem;line-height:1.7}
.import-btn{padding:10px 24px;border:1px solid #1a1a1a;border-radius:8px;background:#fff;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.import-sub{font-size:12px;color:#a3a3a3;margin-top:10px}
.view-tabs{display:flex;border-bottom:1px solid #e5e5e3}
.view-tab{flex:1;padding:9px 6px;border:none;background:#fafaf9;cursor:pointer;font-size:12px;font-weight:600;color:#a3a3a3;border-bottom:2px solid transparent;margin-bottom:-1px}
.view-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;background:#fff}
.ov-section{padding:14px 16px;border-bottom:1px solid #f0f0ef}
.ov-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#a3a3a3;margin-bottom:8px}
.stat-pill{background:#f5f5f3;border-radius:8px;padding:10px 12px;text-align:center}
.wt-input{width:76px;padding:6px 8px;border:1px solid #e5e5e3;border-radius:6px;font-size:13px;text-align:center;background:#fff;color:#1a1a1a}
.wt-log-btn{padding:6px 12px;border:1px solid #1a1a1a;border-radius:6px;background:#fff;color:#fff;cursor:pointer;font-size:12px;font-weight:600}
.ex-link{cursor:pointer;border-bottom:1px dotted #a3a3a3;transition:color 0.15s}
.ex-link:hover{color:#2563eb;border-bottom-color:#2563eb}
#ex-modal-inner{background:#fff;border-radius:14px;padding:22px 20px 16px;max-width:240px;width:88%;text-align:center}
#ex-modal-name{font-size:13px;font-weight:600;margin:10px 0 12px;color:#1a1a1a}
.ex-close-btn{padding:6px 18px;border:1px solid #e5e5e3;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#1a1a1a}

#ex-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<script>
let program = null;
let completed = JSON.parse(localStorage.getItem('u50-done') || '[]');
let viewIdx = 0;

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const PROG_START = new Date(2026, 3, 13);

const PHASE_COLORS = {
  'Cut + Base':    {bg:'#fff7ed',color:'#ea580c',label:'Phase 1'},
  'Aerobic Build': {bg:'#eff6ff',color:'#2563eb',label:'Phase 2'},
  'Peak':          {bg:'#f0fdf4',color:'#16a34a',label:'Phase 3'},
  'Taper':         {bg:'#faf5ff',color:'#9333ea',label:'Phase 4'}
};

function sessionStyle(day) {
  if (!day.run && !day.lift) return {bg:'#f5f5f4',color:'#737373',label:'Rest'};
  if (day.lift && day.run)   return {bg:'#f5f3ff',color:'#7c3aed',label:'Lift + run'};
  if (day.lift)              return {bg:'#eff6ff',color:'#2563eb',label:'Strength'};
  if (day.run.effort === 'Easy')     return {bg:'#f0fdf4',color:'#16a34a',label:'Easy run'};
  if (day.run.effort === 'Moderate') return {bg:'#fff7ed',color:'#ea580c',label:'Long run'};
  return {bg:'#fff1f2',color:'#dc2626',label:'Hard run'};
}

function effortStyle(e) {
  if (e === 'Hard')     return {bg:'#fee2e2',color:'#dc2626'};
  if (e === 'Moderate') return {bg:'#ffedd5',color:'#ea580c'};
  return {bg:'#dcfce7',color:'#16a34a'};
}

function getTodayIdx() {
  const diff = Math.floor((new Date() - PROG_START) / 86400000);
  return Math.max(0, Math.min(diff, (program||[]).length - 1));
}

function render() {
  const app = document.getElementById('app');
  if (!program) { renderImport(app); return; }
  const day = program[viewIdx];
  const todayIdx = getTodayIdx();
  const dk = `${day.week}-${day.day}`;
  const isDone = completed.includes(dk);
  const ph = PHASE_COLORS[day.phase] || PHASE_COLORS['Taper'];
  const ss = sessionStyle(day);
  const pct = Math.round(completed.length / 1.4);
  const di = (day.week-1)*7 + DAYS.indexOf(day.day);
  const left = 140 - di;
  const ws = Math.floor(viewIdx/7)*7;
  const wDays = program.slice(ws, Math.min(ws+7, program.length));
  const title = day.lift && !day.run ? day.lift.title.split('—')[0].trim()
              : day.run && !day.lift ? day.run.type
              : day.run && day.lift ? day.lift.title.split('—')[0].trim() + ' + ' + day.run.miles + 'mi run'
              : 'Rest day';

  let exRows = '';
  if (day.lift) {
    exRows = day.lift.exercises.map(ex =>
      `<div class="ex-row"><span class="ex-link" onclick="showExercise('${ex.name}')">${ex.name}</span><span class="ex-sets">${ex.sets}</span><span class="ex-sets">${ex.reps}</span></div>`
    ).join('');
  }

  let macroColors = [
    {l:'Protein',v:day.nutrition.protein_g+'g',bg:'#eff6ff',c:'#2563eb'},
    {l:'Carbs',v:day.nutrition.carbs_g+'g',bg:'#fff7ed',c:'#ea580c'},
    {l:'Fat',v:day.nutrition.fat_g+'g',bg:'#f5f5f4',c:'#525252'},
    {l:'Cal',v:day.nutrition.totalCalories,bg:'#f0fdf4',c:'#16a34a'},
  ];

  let mealCards = day.nutrition.meals.map(m =>
    `<div class="meal-card"><div class="meal-header"><span class="meal-name">${m.meal}</span><span class="meal-cal">${m.calories} cal</span></div><div class="meal-items">${m.items}</div></div>`
  ).join('');

  let weekDayHtml = wDays.map((d, i) => {
    const k = `${d.week}-${d.day}`;
    const done = completed.includes(k);
    const active = ws + i === viewIdx;
    const ds = sessionStyle(d);
    const dotBg = done ? '#16a34a' : ds.color;
    const info = d.run ? d.run.miles + 'mi' : d.lift ? 'lift' : 'rest';
    return `<div class="week-day${active?' active':''}" style="${active?'border-color:'+ds.color+';background:'+ds.bg:''}" onclick="jumpTo(${ws+i})">
      <div class="week-day-name">${DAYS[i]}</div>
      <div class="week-dot" style="background:${dotBg};opacity:${done?1:0.3}"></div>
      <div class="week-info">${info}</div>
    </div>`;
  }).join('');

  let wkNums = Array.from({length:20},(_,i)=>i+1).map(w =>
    `<div class="wk-num${w===day.week?' active':''}" onclick="jumpTo(${(w-1)*7})">${w}</div>`
  ).join('');

  let workoutSection = '';
  if (day.lift || day.run) {
    let liftHtml = '';
    if (day.lift) {
      liftHtml = `<button class="section-toggle" onclick="toggleSection('lift')">
        Workout: ${day.lift.title} <span id="lift-arrow">▲</span>
      </button>
      <div id="lift-body" class="section-body">
        <div class="ex-header"><span>Exercise</span><span>Sets</span><span>Reps</span></div>
        ${exRows}
        <div class="lift-note">${day.lift.note}</div>
      </div>`;
    }
    let runHtml = '';
    if (day.run) {
      const ef = effortStyle(day.run.effort);
      runHtml = `<button class="section-toggle" style="border-top:${day.lift?'1px solid #f0f0ef':'none'}" onclick="toggleSection('run')">
        Run: ${day.run.type} <span id="run-arrow">▲</span>
      </button>
      <div id="run-body" class="section-body">
        <div class="run-block">
          <div class="run-header">
            <span class="run-title">${day.run.type}</span>
            <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:${ef.bg};color:${ef.color};font-weight:600">${day.run.effort}</span>
            <span class="run-miles">${day.run.miles} mi</span>
          </div>
          <div class="run-desc">${day.run.description}</div>
        </div>
      </div>`;
    }
    workoutSection = `<div style="border-bottom:1px solid #f0f0ef">${liftHtml}${runHtml}</div>`;
  } else {
    workoutSection = `<div class="rest-msg">Full rest day. Light walking (20–30 min) welcome. Foam roll, stretch, 8 hours sleep. Recovery is when training adaptation locks in.</div>`;
  }

  const tabs = `<div class="view-tabs"><button class="view-tab ${currentView==='today'?'active':''}" onclick="setView('today')">Today</button><button class="view-tab ${currentView==='overview'?'active':''}" onclick="setView('overview')">Overview</button></div>`;

  if(currentView === 'overview'){
    app.innerHTML = `<div class="card">${tabs}${renderOverview()}</div><input type="file" id="file-input" accept=".json" onchange="loadFile(event)" style="display:none">`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      ${tabs}
      <div class="header">
        <div class="header-top">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="phase-badge" style="background:${ph.bg};color:${ph.color}">${ph.label}: ${day.phase}</span>
            <strong>Week ${day.week} / 20</strong>
          </div>
          <span style="font-size:11px;color:#737373">${left > 0 ? left + ' days to race' : 'Race week'}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>${completed.length} / 140 days done</span><span>${pct}%</span></div>
      </div>

      <div class="nav">
        <button class="nav-btn" onclick="go(-1)" ${viewIdx===0?'disabled':''}>←</button>
        <div class="nav-center">Day ${viewIdx+1} of 140</div>
        <button class="nav-btn" onclick="go(1)" ${viewIdx===program.length-1?'disabled':''}>→</button>
        ${viewIdx !== todayIdx ? `<button class="today-btn" onclick="jumpTo(${todayIdx})">Today</button>` : ''}
      </div>

      <div class="day-hero">
        <div class="day-meta">${day.day} · ${day.date}</div>
        <div class="day-row">
          <div>
            <div class="day-title">${title}</div>
            <div class="badges">
              <span class="badge" style="background:${ss.bg};color:${ss.color}">${ss.label}</span>
              ${day.run ? `<span class="badge badge-secondary">${day.run.miles} mi</span>` : ''}
              <span class="badge badge-secondary">${day.nutrition.totalCalories} cal</span>
            </div>
          </div>
          <button class="mark-btn ${isDone?'done':''}" onclick="toggleDone('${dk}')">${isDone ? '✓ Done' : 'Mark done'}</button>
        </div>
      </div>

      ${workoutSection}

      <button class="section-toggle" onclick="toggleSection('nutrition')">
        Nutrition — ${day.nutrition.totalCalories} cal <span id="nutrition-arrow">▲</span>
      </button>
      <div id="nutrition-body" class="section-body">
        <div class="macro-grid">
          ${macroColors.map(m=>`<div class="macro-card" style="background:${m.bg}"><div class="macro-val" style="color:${m.c}">${m.v}</div><div class="macro-lbl">${m.l}</div></div>`).join('')}
        </div>
        ${mealCards}
      </div>

      <div class="week-strip">
        <div class="week-label">This week</div>
        <div class="week-grid">${weekDayHtml}</div>
      </div>

      <div class="week-jumper">
        <div class="week-label">Jump to week</div>
        <div class="week-nums">${wkNums}</div>
      </div>

      <div class="footer">
        <button class="footer-btn" onclick="document.getElementById('file-input').click()">Re-import JSON</button>
        <button class="footer-btn" onclick="clearData()">Clear data</button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".json" onchange="loadFile(event)" style="display:none">
  `;
}

function renderImport(app) {
  app.innerHTML = `
    <div class="card">
      <div class="import-screen">
        <div class="import-icon">↑</div>
        <div class="import-title">Ultra 50 Dashboard</div>
        <div class="import-desc">Import your program JSON file to start tracking daily workouts and nutrition.</div>
        <button class="import-btn" onclick="document.getElementById('file-input').click()">Import program JSON</button>
        <div class="import-sub">Open ultra_50_program.json</div>
      </div>
    </div>
    <input type="file" id="file-input" accept=".json" onchange="loadFile(event)" style="display:none">
  `;
}

function loadFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data) || !data[0]?.week) { alert('Invalid program JSON.'); return; }
      program = data;
      viewIdx = getTodayIdx();
      localStorage.setItem('u50-prog', JSON.stringify(data));
      render();
    } catch(err) { alert('Could not parse file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function go(dir) { viewIdx = Math.max(0, Math.min(program.length-1, viewIdx+dir)); render(); }
function jumpTo(i) { viewIdx = i; render(); }

function toggleDone(dk) {
  if (completed.includes(dk)) { completed = completed.filter(k => k !== dk); }
  else { completed.push(dk); }
  localStorage.setItem('u50-done', JSON.stringify(completed));
  render();
}

function clearData() {
  if (!confirm('Clear all data and progress?')) return;
  program = null; completed = []; viewIdx = 0;
  localStorage.removeItem('u50-prog');
  localStorage.removeItem('u50-done');
  render();
}

function toggleSection(id) {
  const body = document.getElementById(id+'-body');
  const arrow = document.getElementById(id+'-arrow');
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (arrow) arrow.textContent = hidden ? '▲' : '▼';
}

var currentView = 'overview';
var weightLog = JSON.parse(localStorage.getItem('u50-weight') || '[]');

// Load saved program — localStorage first, then fetch program.json
const saved = localStorage.getItem('u50-prog');
if (saved) {
  try { program = JSON.parse(saved); viewIdx = getTodayIdx(); } catch(e) {}
  render();
} else {
  fetch('program.json')
    .then(r => r.json())
    .then(data => {
      program = data;
      viewIdx = getTodayIdx();
      localStorage.setItem('u50-prog', JSON.stringify(data));
      render();
    })
    .catch(() => render());
}

function logWeight(){
  const el=document.getElementById('wt-val');
  const val=parseFloat(el.value);
  if(isNaN(val)||val<100||val>400) return;
  const today=new Date().toISOString().split('T')[0];
  weightLog=weightLog.filter(e=>e.d!==today);
  weightLog.push({d:today,w:val});
  weightLog.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('u50-weight',JSON.stringify(weightLog));
  render();
}

function getWkData(w){
  if(!program) return {target:0,done:0,phase:'Cut + Base'};
  const days=program.filter(d=>d.week===w);
  const target=Math.round(days.reduce((s,d)=>s+(d.run?d.run.miles:0),0));
  const done=Math.round(days.reduce((s,d)=>{const k=`${d.week}-${d.day}`;return s+(completed.includes(k)&&d.run?d.run.miles:0);},0));
  return {target,done,phase:days[0]?.phase||'Taper'};
}
function getTotalMi(){return program?Math.round(program.reduce((s,d)=>s+(d.run?d.run.miles:0),0)):0;}
function getDoneMi(){return program?Math.round(program.reduce((s,d)=>{const k=`${d.week}-${d.day}`;return s+(completed.includes(k)&&d.run?d.run.miles:0);},0)):0;}
function getStreak(){
  if(!program) return 0;
  let st=0,tod=getTodayIdx();
  for(let i=tod;i>=0;i--){
    const d=program[i];
    if(!d.run&&!d.lift) continue;
    if(completed.includes(`${d.week}-${d.day}`)) st++;
    else break;
  }
  return st;
}
function getEfforts(){
  const r={e:0,m:0,h:0};
  if(!program) return r;
  program.forEach(d=>{
    const k=`${d.week}-${d.day}`;
    if(completed.includes(k)&&d.run){
      if(d.run.effort==='Easy') r.e++;
      else if(d.run.effort==='Moderate') r.m++;
      else r.h++;
    }
  });
  return r;
}
function daysToRace(){
  const race=new Date(2026,7,30);
  const now=new Date();now.setHours(0,0,0,0);
  return Math.max(0,Math.round((race-now)/86400000));
}

function loadArcSVG(){
  const W=310,H=128,pl=26,pr=6,pt=8,pb=24,cw=W-pl-pr,ch=H-pt-pb;
  const phC={'Cut + Base':'#fb923c','Aerobic Build':'#3b82f6','Peak':'#22c55e','Taper':'#a855f7'};
  const wks=Array.from({length:20},(_,i)=>({...getWkData(i+1),w:i+1}));
  const maxM=Math.max(...wks.map(d=>d.target),1);
  const curW=program[viewIdx]?.week||1;
  const bw=Math.floor(cw/20)-2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  [20,40,58].forEach(mi=>{
    const y=pt+ch-(mi/maxM)*ch;
    s+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#f5f5f3" stroke-width="1"/>`;
    s+=`<text x="${pl-3}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#d4d4d2">${mi}</text>`;
  });
  wks.forEach(({w,target,done,phase})=>{
    const x=pl+(w-1)*(cw/20);
    const c=phC[phase]||'#888';
    const th=(target/maxM)*ch, dh=(done/maxM)*ch;
    s+=`<rect x="${(x+1).toFixed(1)}" y="${(pt+ch-th).toFixed(1)}" width="${bw}" height="${th.toFixed(1)}" rx="2" fill="${c}" opacity="0.2"/>`;
    if(done>0) s+=`<rect x="${(x+1).toFixed(1)}" y="${(pt+ch-dh).toFixed(1)}" width="${bw}" height="${dh.toFixed(1)}" rx="2" fill="${c}"/>`;
    if(w===curW) s+=`<rect x="${x.toFixed(1)}" y="${pt}" width="${(bw+2)}" height="${ch}" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>`;
    if(w%5===0||w===1) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="8" fill="#a3a3a3">${w}</text>`;
  });
  s+=`<line x1="${pl}" y1="${pt+ch}" x2="${W-pr}" y2="${pt+ch}" stroke="#e5e5e3" stroke-width="1"/>`;
  return s+'</svg>';
}

function longRunSVG(){
  const W=310,H=108,pl=26,pr=8,pt=8,pb=20,cw=W-pl-pr,ch=H-pt-pb;
  const curW=program[viewIdx]?.week||1;
  const pts=Array.from({length:20},(_,i)=>{
    const w=i+1;
    const runs=program.filter(d=>d.week===w&&d.run);
    if(!runs.length) return {w,mi:0,done:false};
    const mi=Math.max(...runs.map(d=>d.run.miles));
    const lr=runs.find(d=>d.run.miles===mi);
    return {w,mi,done:lr?completed.includes(`${lr.week}-${lr.day}`):false};
  });
  const maxM=Math.max(...pts.map(p=>p.mi),1);
  const xS=w=>pl+((w-1)/19)*cw;
  const yS=m=>pt+ch-(m/maxM)*ch;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  [7,14,20,24].forEach(mi=>{
    const y=yS(mi);
    s+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#f5f5f3" stroke-width="1"/>`;
    s+=`<text x="${pl-3}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#d4d4d2">${mi}</text>`;
  });
  const allValid=pts.filter(p=>p.mi>0);
  if(allValid.length>1) s+=`<polyline points="${allValid.map(p=>`${xS(p.w).toFixed(1)},${yS(p.mi).toFixed(1)}`).join(' ')}" fill="none" stroke="#e5e5e3" stroke-width="1.5" stroke-dasharray="3,3"/>`;
  const done=pts.filter(p=>p.done&&p.mi>0);
  if(done.length>1) s+=`<polyline points="${done.map(p=>`${xS(p.w).toFixed(1)},${yS(p.mi).toFixed(1)}`).join(' ')}" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  allValid.forEach(p=>{
    const cx=xS(p.w).toFixed(1),cy=yS(p.mi).toFixed(1);
    s+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="${p.done?'#22c55e':'#e5e5e3'}" stroke="${p.done?'#16a34a':'#d1d5db'}" stroke-width="1"/>`;
    if(p.w===curW) s+=`<circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>`;
  });
  s+=`<line x1="${pl}" y1="${pt+ch}" x2="${W-pr}" y2="${pt+ch}" stroke="#e5e5e3" stroke-width="1"/>`;
  [1,5,10,15,20].forEach(w=>{ s+=`<text x="${xS(w).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="8" fill="#a3a3a3">${w}</text>`; });
  return s+'</svg>';
}

function donutSVG(e,m,h){
  const total=e+m+h;
  const cx=40,cy=40,r=27,sw=10,circ=2*Math.PI*r;
  let s=`<svg viewBox="0 0 80 80" width="80" height="80">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f5f5f3" stroke-width="${sw}"/>`;
  if(total>0){
    let off=0;
    [[e,'#4ade80'],[m,'#fb923c'],[h,'#f87171']].forEach(([v,c])=>{
      const d=(v/total)*circ;
      s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${d.toFixed(2)} ${(circ-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
      off+=d;
    });
  }
  s+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">${total}</text>`;
  s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="7" fill="#a3a3a3">runs</text>`;
  return s+'</svg>';
}

function wtSparkSVG(){
  if(weightLog.length<1) return '<div style="font-size:12px;color:#a3a3a3;margin-top:10px">Log your first entry above to start the graph.</div>';
  const W=310,H=180,pl=36,pr=16,pt=14,pb=30,cw=W-pl-pr,ch=H-pt-pb;
  const vals=weightLog.map(e=>e.w);
  const rawMin=Math.min(...vals,175), rawMax=Math.max(...vals,200);
  const pad=3;
  const minV=rawMin-pad, maxV=rawMax+pad;
  const n=Math.max(weightLog.length-1,1);
  const xS=i=>pl+(i/n)*cw;
  const yS=v=>pt+ch-((v-minV)/(maxV-minV))*ch;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:12px">`;
  // Grid lines + y-axis labels
  const yTicks=[];
  for(let v=Math.ceil(minV/5)*5;v<=maxV;v+=5) yTicks.push(v);
  yTicks.forEach(v=>{
    const y=yS(v).toFixed(1);
    s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#f0f0ef" stroke-width="1"/>`;
    s+=`<text x="${pl-5}" y="${(parseFloat(y)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#a3a3a3">${v}</text>`;
  });
  // Start line at 200
  if(maxV>=200){
    const sy=yS(200).toFixed(1);
    s+=`<line x1="${pl}" y1="${sy}" x2="${W-pr}" y2="${sy}" stroke="#f87171" stroke-width="1" stroke-dasharray="4,3"/>`;
    s+=`<text x="${W-pr+3}" y="${(parseFloat(sy)+3).toFixed(1)}" font-size="9" fill="#f87171" font-weight="600">200</text>`;
  }
  // Goal line at 175
  const gy=yS(175).toFixed(1);
  s+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  s+=`<text x="${W-pr+3}" y="${(parseFloat(gy)+3).toFixed(1)}" font-size="9" fill="#22c55e" font-weight="600">Goal</text>`;
  // Area fill under line
  if(weightLog.length>1){
    const pts=weightLog.map((e,i)=>`${xS(i).toFixed(1)},${yS(e.w).toFixed(1)}`).join(' ');
    const firstX=xS(0).toFixed(1), lastX=xS(weightLog.length-1).toFixed(1), baseY=(pt+ch).toFixed(1);
    s+=`<polygon points="${firstX},${baseY} ${pts} ${lastX},${baseY}" fill="#3b82f6" opacity="0.08"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // Data points + date labels on x-axis
  const step=Math.max(1,Math.floor(weightLog.length/6));
  weightLog.forEach((e,i)=>{
    const cx=xS(i).toFixed(1),cy=yS(e.w).toFixed(1);
    s+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>`;
    // Tooltip-style label on hover not possible in SVG, show value above point
    s+=`<text x="${cx}" y="${(parseFloat(cy)-7).toFixed(1)}" text-anchor="middle" font-size="8" fill="#3b82f6" font-weight="600">${e.w}</text>`;
    // X-axis date labels spaced out
    if(i===0||i===weightLog.length-1||i%step===0){
      const d=new Date(e.d);
      const lbl=`${d.getMonth()+1}/${d.getDate()}`;
      s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="9" fill="#a3a3a3">${lbl}</text>`;
    }
  });
  // Axis lines
  s+=`<line x1="${pl}" y1="${pt}" x2="${pl}" y2="${pt+ch}" stroke="#e5e5e3" stroke-width="1"/>`;
  s+=`<line x1="${pl}" y1="${pt+ch}" x2="${W-pr}" y2="${pt+ch}" stroke="#e5e5e3" stroke-width="1"/>`;
  // Lost so far label
  if(weightLog.length>=2){
    const lost=(weightLog[0].w-weightLog[weightLog.length-1].w).toFixed(1);
    const toGo=(weightLog[weightLog.length-1].w-175).toFixed(1);
    s+=`<text x="${pl}" y="${pt-3}" font-size="9" fill="#737373">Lost: <tspan font-weight="700" fill="#3b82f6">${lost>0?lost:0} lbs</tspan>  ·  To goal: <tspan font-weight="700" fill="#22c55e">${toGo>0?toGo:0} lbs</tspan></text>`;
  }
  return s+'</svg>';
}

function renderOverview(){
  if(!program) return '<div style="padding:24px;text-align:center;color:#737373;font-size:13px">Import a program to see stats.</div>';
  const curW=program[viewIdx]?.week||1;
  const dtr=daysToRace();
  const totalMi=getTotalMi(),doneMi=getDoneMi();
  const miPct=Math.round(doneMi/totalMi*100)||0;
  const streak=getStreak();
  const compPct=Math.round(completed.length/140*100)||0;
  const {target:wkT,done:wkD}=getWkData(curW);
  const wkPct=wkT?Math.round(Math.min(100,wkD/wkT*100)):0;
  const {e,m,h}=getEfforts();
  const eff=e+m+h;
  const lastWt=weightLog.length?weightLog[weightLog.length-1].w:null;
  const wtPct=lastWt?Math.round(Math.max(0,Math.min(100,(200-lastWt)/25*100))):0;

  return `
  <div class="ov-section" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="stat-pill" style="background:#fff7ed">
      <div style="font-size:36px;font-weight:700;color:#ea580c;line-height:1">${dtr}</div>
      <div style="font-size:11px;color:#9a6030;margin-top:4px">days to race day</div>
    </div>
    <div class="stat-pill">
      <div style="font-size:36px;font-weight:700;color:#1a1a1a;line-height:1">${compPct}%</div>
      <div style="font-size:11px;color:#737373;margin-top:4px">${completed.length} / 140 days done</div>
    </div>
  </div>

  <div class="ov-section">
    <div class="ov-label" style="margin-bottom:6px">Training load — 20 weeks</div>
    <div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap">
      ${[['Ph1','#fb923c'],['Ph2','#3b82f6'],['Ph3','#22c55e'],['Ph4','#a855f7']].map(([l,c])=>`<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:#737373"><span style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block"></span>${l}</span>`).join('')}
      <span style="font-size:9px;color:#d4d4d2;margin-left:2px">faded=target · solid=done · box=now</span>
    </div>
    ${loadArcSVG()}
  </div>

  <div class="ov-section" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div>
      <div class="ov-label">Week ${curW} miles</div>
      <div style="font-size:26px;font-weight:700;line-height:1">${wkD}<span style="font-size:13px;font-weight:400;color:#737373"> / ${wkT}mi</span></div>
      <div style="height:5px;background:#f0f0ef;border-radius:999px;margin-top:10px;overflow:hidden">
        <div style="width:${wkPct}%;height:100%;background:#3b82f6;border-radius:999px;transition:width 0.4s"></div>
      </div>
    </div>
    <div>
      <div class="ov-label">Streak</div>
      <div style="font-size:26px;font-weight:700;line-height:1">${streak}<span style="font-size:13px;font-weight:400;color:#737373"> days</span></div>
      <div style="font-size:11px;color:#737373;margin-top:10px">${streak>=14?'Unstoppable':streak>=7?'On fire':streak>=3?'Building momentum':'Start your streak'}</div>
    </div>
  </div>

  <div class="ov-section">
    <div class="ov-label">Long run progression <span style="font-weight:400;color:#d4d4d2;text-transform:none;letter-spacing:0">green=done · dashed=upcoming · ring=this week</span></div>
    ${longRunSVG()}
  </div>

  <div class="ov-section" style="display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:center">
    <div>${donutSVG(e,m,h)}</div>
    <div>
      <div class="ov-label">Effort split</div>
      ${[['Easy','#4ade80',e],['Moderate','#fb923c',m],['Hard','#f87171',h]].map(([l,c,v])=>`
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0"></span>
        <span style="font-size:12px;color:#525252;width:60px">${l}</span>
        <div style="flex:1;height:4px;background:#f5f5f3;border-radius:999px;overflow:hidden">
          <div style="width:${eff?Math.round(v/eff*100):0}%;height:100%;background:${c}"></div>
        </div>
        <span style="font-size:12px;font-weight:700;color:#1a1a1a;min-width:20px;text-align:right">${v}</span>
      </div>`).join('')}
      <div style="font-size:11px;color:#a3a3a3;margin-top:2px">Target: 75%+ easy effort in ultra training</div>
    </div>
  </div>

  <div class="ov-section">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <div class="ov-label" style="margin:0">Cumulative miles</div>
      <span style="font-size:20px;font-weight:700">${doneMi}<span style="font-size:12px;font-weight:400;color:#737373"> / ${totalMi}mi</span></span>
    </div>
    <div style="height:8px;background:#f0f0ef;border-radius:999px;overflow:hidden;margin-bottom:5px">
      <div style="width:${miPct}%;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:999px;transition:width 0.4s"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#d4d4d2">
      <span>0</span><span>${Math.round(totalMi*.25)}</span><span>${Math.round(totalMi*.5)}</span><span>${Math.round(totalMi*.75)}</span><span>${totalMi}</span>
    </div>
  </div>

  <div class="ov-section">
    <div class="ov-label">Weight tracker <span style="font-weight:400;color:#d4d4d2;text-transform:none;letter-spacing:0">200 → 175 lbs goal</span></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <input type="number" id="wt-val" class="wt-input" placeholder="${lastWt||'lbs'}" step="0.5" min="100" max="400"/>
      <button class="wt-log-btn" onclick="logWeight()">Log</button>
      ${lastWt?`<span style="font-size:12px;color:#525252">Last: <strong>${lastWt} lbs</strong> · <span style="color:#22c55e;font-weight:600">${wtPct}% to goal</span></span>`:'<span style="font-size:12px;color:#a3a3a3">Enter your weight to start tracking</span>'}
    </div>
    ${lastWt?`<div style="height:5px;background:#f0f0ef;border-radius:999px;overflow:hidden;margin-bottom:4px"><div style="width:${wtPct}%;height:100%;background:#22c55e;border-radius:999px"></div></div>`:''}
    ${wtSparkSVG()}
  </div>

  <div class="footer">
    <button class="footer-btn" onclick="document.getElementById('file-input').click()">Re-import JSON</button>
    <button class="footer-btn" onclick="clearData()">Clear data</button>
  </div>
  `;
}
</script>
<div id="ex-modal" onclick="closeExModal(event)"><div id="ex-modal-inner"><div id="ex-modal-box"></div><div id="ex-modal-name"></div><a id="ex-yt-link" href="" target="_blank" style="display:inline-block;margin-bottom:10px;padding:6px 14px;background:#ff0000;color:#fff;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none">▶ Watch on YouTube</a><br><button class="ex-close-btn" onclick="document.getElementById('ex-modal').style.display='none'">Close</button></div></div></body>
</html>
